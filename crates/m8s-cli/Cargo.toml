[package]
name = "m8s-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
prototype-container = ["dep:m8s-agent", "m8s-agent/sealed-node"]
prototype-vast = ["dep:m8sd", "m8sd/prototype-vast", "dep:m8s-provider-vast", "m8s-provider-vast/watchdog", "m8s-provider-vast/launch-https"]
local-development = ["dep:m8sd", "m8sd/local-development"]

[dependencies]
m8s-agent = { path = "../m8s-agent", optional = true, default-features = false }
m8s-core.workspace = true
m8sd = { path = "../m8sd", optional = true, default-features = false }
m8s-config = { path = "../m8s-config" }
m8s-models = { path = "../m8s-models" }
toml = "=1.1.8"
m8s-api.workspace = true
m8s-top = { path = "../m8s-top" }
serde_json.workspace = true
serde.workspace = true
m8s-secrets = { path = "../m8s-secrets" }
m8s-provider-vast = { path = "../m8s-provider-vast", optional = true, default-features = false }

[[bin]]
name = "m8s"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

nix = { version = "0.29", default-features = false, features = ["term", "signal", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["user", "poll"] }
