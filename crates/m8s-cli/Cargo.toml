[package]
name = "m8s-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
m8s-api.workspace = true
m8s-top = { path = "../m8s-top" }
serde_json.workspace = true
m8s-secrets = { path = "../m8s-secrets" }

[[bin]]
name = "m8s"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

nix = { version = "0.29", default-features = false, features = ["term", "signal", "fs"] }
