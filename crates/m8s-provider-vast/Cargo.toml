[package]
name = "m8s-provider-vast"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
m8s-core.workspace = true
m8s-provider.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
readonly-https = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:m8s-secrets"]
scoped-destroy-https = ["readonly-https"]
watchdog = ["scoped-destroy-https", "dep:libc"]
launch-https = ["scoped-destroy-https"]

[[bin]]
name = "m8s-vast-watchdog"
path = "src/bin/watchdog.rs"
required-features = ["watchdog"]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dependencies.reqwest]
version = "=0.13.5"
default-features = false
features = ["blocking", "rustls"]
optional = true

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["std", "tls12", "aws_lc_rs"]
optional = true

[dependencies.webpki-roots]
version = "1"
optional = true

[dependencies.m8s-secrets]
path = "../m8s-secrets"
optional = true
