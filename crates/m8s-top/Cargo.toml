[package]
name = "m8s-top"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
m8s-api.workspace = true
m8s-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
socket2 = { version = "0.6", default-features = false }
signal-hook = { version = "0.3", default-features = false }
nix = { version = "0.29", default-features = false, features = ["user", "socket", "poll"] }

[dev-dependencies]
tempfile = "3"
nix = { version = "0.29", default-features = false, features = ["term", "signal", "fs"] }
