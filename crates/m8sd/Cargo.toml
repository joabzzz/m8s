[package]
name = "m8sd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
local-development = ["dep:m8s-provider-local"]

[dependencies]
m8s-config = { path = "../m8s-config" }
m8s-provider-local = { path = "../m8s-provider-local", optional = true }
m8s-core.workspace = true
m8s-provider.workspace = true
m8s-api.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
fs2.workspace = true
sha2.workspace = true

m8s-bootstrap = { path = "../m8s-bootstrap" }
zeroize.workspace = true

libc = "0.2"

[[example]]
name = "local-lifecycle-demo"
path = "examples/local_lifecycle_demo.rs"
required-features = ["local-development"]
test = true
