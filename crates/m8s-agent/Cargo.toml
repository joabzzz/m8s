[package]
name = "m8s-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
authenticated-control = ["dep:m8s-bootstrap", "m8s-bootstrap/iroh-transport"]
sealed-node = ["authenticated-control", "m8s-bootstrap/mp001-certificates", "dep:m8s-secrets", "dep:nix"]

[dependencies]
m8s-bootstrap = { path = "../m8s-bootstrap", default-features = false, optional = true }
m8s-core.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }
m8s-secrets = { path = "../m8s-secrets", optional = true }
nix = { version = "0.29", default-features = false, features = ["user"], optional = true }
