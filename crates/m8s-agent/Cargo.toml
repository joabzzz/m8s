[package]
name = "m8s-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
authenticated-control = ["dep:m8s-bootstrap", "m8s-bootstrap/iroh-transport"]

[dependencies]
m8s-bootstrap = { path = "../m8s-bootstrap", default-features = false, optional = true }
m8s-core.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }
