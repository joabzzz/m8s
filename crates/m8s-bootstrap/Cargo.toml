[package]
name = "m8s-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
default = []
iroh-transport = ["dep:iroh", "dep:tokio"]

[dependencies.iroh]
version = "=1.3.0"
default-features = false
features = ["tls-aws-lc-rs"]
optional = true

[dependencies.tokio]
version = "1"
features = ["rt", "macros", "net", "time", "io-util"]
optional = true

[dev-dependencies]
ed25519-dalek = "=3.0.0"
