[package]
name = "m8s-bootstrap-mp001-qualification"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
m8sd = { path = "../../crates/m8sd", default-features = false }
m8s-bootstrap = { path = "../../crates/m8s-bootstrap", default-features = false, features = ["iroh-transport", "mp001-certificates"] }
mesh-llm-identity = { path = "../../vendor/mesh-llm-identity", default-features = false, features = ["host-io"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-aws-lc-rs"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
rusqlite = { version = "0.38", features = ["bundled"] }
zeroize = "1"
serde_json = "1"
tempfile = "3"
