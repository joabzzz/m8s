name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  check:
    name: Checks and mock demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install native build dependencies
        timeout-minutes: 5
        run: |
          missing=()
          command -v cc >/dev/null && command -v c++ >/dev/null || missing+=(build-essential)
          command -v cmake >/dev/null || missing+=(cmake)
          command -v clang >/dev/null || missing+=(clang)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists openssl 2>/dev/null || missing+=(libssl-dev)
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Check test profiles
        run: python3 -B scripts/test-check-profiles

      - name: Check formatting, tests, and Clippy
        run: ./scripts/check --no-pty --no-acl-mutation

      - name: Test container tooling
        run: python3 -B -m unittest discover -s deploy/container/tests -v

      - name: Run mock demo
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          ./scripts/mock-e2e
